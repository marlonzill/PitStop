name: Gerar APK Competidor (PitStop-Sports)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Configurar Java 21 (requisito Capacitor Android)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Instalar dependências
        run: npm install

      - name: Compilar modo exclusivo Competidor e sincronizar Android
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: npm run cap:sync

      - name: Dar permissão de execução ao Gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Debug (pronto para instalar no Android)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PitStop-Sports.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v5
        with:
          name: PitStop-Sports-Coletor-APK
          path: PitStop-Sports.apk
          retention-days: 30

      - name: Publicar APK na aba Releases (Link Público)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PitStop-Sports (Última Versão)
          files: PitStop-Sports.apk
